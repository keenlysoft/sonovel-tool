events {
    worker_connections 1024;
}

http {
    map $http_origin $cors_origin {
        default "";
        ~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$ $http_origin;
    }

    map $http_origin $block_cross_origin {
        default 1;
        "" 0;
        ~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$ 0;
    }

    # SoNovel 内部下载器使用共享状态，同一时刻只允许一个拉取请求。
    limit_conn_zone $server_name zone=book_fetch:10m;

    upstream sonovel {
        server sonovel:7765;
    }

    server {
        listen 80;
        server_name localhost;

        location = /async-download.js {
            root /usr/share/nginx/html;
            add_header 'Cache-Control' 'no-store';
        }

        location = /book-fetch {
            if ($block_cross_origin) {
                return 403;
            }

            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Cache-Control' 'no-store, no-cache, must-revalidate' always;

            limit_conn book_fetch 1;
            limit_conn_status 429;

            proxy_pass http://sonovel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ignore_client_abort on;
            proxy_buffering off;
            proxy_read_timeout 1800s;
        }

        # 处理 CORS 预检请求
        location / {
            # 本地工具不接受其他网页跨域调用
            if ($block_cross_origin) {
                return 403;
            }

            # CORS 头
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            add_header 'Cache-Control' 'no-store, no-cache, must-revalidate' always;

            # 处理 OPTIONS 预检请求
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # 反向代理到 SoNovel 服务
            proxy_pass http://sonovel;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header Accept-Encoding "";
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header ETag;

            # 注入非模态后台下载队列；后端静态资源封装在 app.jar 中
            sub_filter_once on;
            sub_filter '</body>' '<script src="/async-download.js"></script></body>';

            # SSE 支持
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }
    }
}
